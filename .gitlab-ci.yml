stages:
  - test

test:
  stage: test
  image: node:24
  before_script:
    - npm install --global corepack@latest
    - corepack enable
    - corepack install
    - pnpm config set store-dir .pnpm-store
  script:
    - pnpm install --frozen-lockfile # install dependencies
    - pnpm test # run tests
  cache:
    key:
      files:
        - pnpm-lock.yaml
    paths:
      - .pnpm-store
