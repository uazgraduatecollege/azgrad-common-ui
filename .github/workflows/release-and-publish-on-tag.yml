name: Create Release and Publish on Tag

on:
  push:
    # Trigger only on semver tags like 1.2.3 (allow prerelease suffixes)
    tags:
      - '*.*.*'
      - '*.*.*-alpha*'
      - '*.*.*-beta*'

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    name: Publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Install pnpm
        uses: pnpm/action-setup@8912a9102ac27614460f54aedde9e1e7f9aec20d # v6.0.5

      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "pnpm"

      - name: Set package version from tag
        run: pnpm version "${GITHUB_REF_NAME}" --no-git-tag-version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build package
        run: pnpm build

      - name: Verify build output
        run: test -f dist/main.js && test -f dist/module.js

      - name: Verify package contents
        run: pnpm pack --dry-run

      - name: Run tests
        run: pnpm test

      - name: Publish to Github Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pnpm config set "//npm.pkg.github.com/:_authToken" "${NODE_AUTH_TOKEN}"
          pnpm publish --registry https://npm.pkg.github.com/ --access restricted --no-git-checks
